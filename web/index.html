<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trinanda Dinantio — Flutter Engineer with 4+ years of experience building F&B POS systems, hardware & bank ECR integrations, AI business assistants, and scalable mobile & tablet apps.">
  <meta name="theme-color" content="#070D19">

  <!-- Open Graph / LinkedIn / WhatsApp Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trinanda Dinantio | Flutter Engineer">
  <meta property="og:description" content="Flutter Engineer building reliable mobile & tablet products: ESB POSLite (printers & bank ECR), OLIN by ESB (AI chatbot + Text-to-Speech), and jobseeker.partners.">
  <meta property="og:url" content="https://tridinantio.github.io/my_personal_website/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Trinanda Dinantio | Flutter Engineer">
  <meta name="twitter:description" content="Flutter Engineer with 4+ years of experience shipping POS, hardware/ECR, AI chatbot, and scalable mobile apps.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trinanda Dinantio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trinanda Dinantio | Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #070D19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #070D19;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    .loader-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #111B2E;
      border: 1px solid #23324D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #6EE7B7;
      letter-spacing: 0.6px;
    }

    .loader-bar {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: #16233B;
      overflow: hidden;
    }

    .loader-bar::after {
      content: "";
      display: block;
      width: 48%;
      height: 100%;
      background: linear-gradient(90deg, #6EE7B7, #7DD3FC);
      border-radius: 999px;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="loading-screen" aria-label="Loading portfolio">
    <div class="loader-badge">TD</div>
    <div class="loader-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
