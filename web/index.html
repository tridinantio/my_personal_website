<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trinanda Dinantio, Flutter Engineer with 4+ years of experience building F&B POS terminals, printer and bank ECR integrations, AI voice tools, and mobile apps.">
  <meta name="theme-color" content="#F7F4EE">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Trinanda Dinantio | Flutter Engineer">
  <meta property="og:description" content="Flutter Engineer building production mobile and tablet products: ESB POSLite (printers and bank ECR), OLIN by ESB (AI chatbot and text-to-speech), and jobseeker.partners.">
  <meta property="og:url" content="https://tridinantio.github.io/my_personal_website/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Trinanda Dinantio | Flutter Engineer">
  <meta name="twitter:description" content="Flutter Engineer building POS hardware integrations, voice AI tools, and mobile apps.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trinanda Dinantio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trinanda Dinantio | Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F7F4EE;
      color: #171614;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #F7F4EE;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }

    .loader-name {
      font-size: 20px;
      font-weight: 600;
      color: #171614;
      letter-spacing: -0.3px;
    }

    .loader-status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #524D46;
    }
  </style>
</head>
<body>
  <main id="loading-screen" aria-live="polite">
    <div class="loader-name">Trinanda Dinantio</div>
    <div class="loader-status">Loading portfolio...</div>
  </main>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 210);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
